name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest

    # ✅ N'exécuter que sur le dépôt du prof (pas sur ton fork)
    if: ${{ github.repository == 'but-sd/marvel-app-2025' && secrets.SONAR_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # meilleur contexte pour l'analyse

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # garde 22 si ton projet le demande
          cache: 'npm'

      - run: npm install
      - run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # pour l’info de PR
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
